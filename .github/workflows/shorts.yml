name: Shorts Pipeline

on:
  schedule:
    # Sun 10:00 UTC → publishes Mon 20:00 UTC
    # Tue 10:00 UTC → publishes Wed 20:00 UTC
    # Thu 10:00 UTC → publishes Fri 20:00 UTC
    # Fri 10:00 UTC → publishes Sat 20:00 UTC
    - cron: "0 10 * * 0,2,4,5"
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Skip YouTube upload"
        type: boolean
        default: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            anthropic \
            edge-tts \
            moviepy \
            pillow \
            requests \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Write .env file
        run: |
          cat > .env <<EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          EOF

      - name: Write YouTube OAuth token
        run: |
          mkdir -p config
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > config/youtube_token.json

      - name: Check latest main script exists
        id: check_script
        run: |
          if [ -f data/latest_main_script.json ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::warning::data/latest_main_script.json not found — run main pipeline first"
          fi

      - name: Run shorts pipeline (from main script)
        if: steps.check_script.outputs.found == 'true'
        run: |
          python run.py --type short --from-main data/latest_main_script.json

      - name: Commit updated data files
        if: steps.check_script.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_shorts_facts.json || true
          git diff --cached --quiet || git commit -m "chore: update used_shorts_facts [skip ci]"
          git push origin HEAD

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
