name: Shorts Pipeline

on:
  schedule:
    # Fri 10:00 UTC → publishes Sun 20:15 UTC (+2 days)
    # Sat 10:00 UTC → publishes Mon 20:15 UTC (+2 days)
    # Mon 10:00 UTC → publishes Wed 20:15 UTC (+2 days)
    # Wed 10:00 UTC → publishes Fri 20:15 UTC (+2 days)
    # Thu 10:00 UTC → publishes Sat 20:15 UTC (+2 days)
    - cron: "0 10 * * 5,6,1,3,4"
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Skip YouTube upload"
        type: boolean
        default: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            anthropic \
            edge-tts \
            moviepy \
            pillow \
            requests \
            google-api-python-client \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Write .env file
        run: |
          cat > .env <<EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}
          EOF

      - name: Write YouTube OAuth token
        run: |
          mkdir -p config
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > config/youtube_token.json

      - name: Check latest main script exists
        id: check_script
        run: |
          if [ -f data/latest_main_script.json ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::warning::data/latest_main_script.json not found — run main pipeline first"
          fi

      - name: Run shorts pipeline (from main script)
        id: run_pipeline
        if: steps.check_script.outputs.found == 'true'
        run: |
          python run.py --type short --from-main data/latest_main_script.json

      - name: Update YouTube token secret
        if: steps.check_script.outputs.found == 'true'
        run: |
          gh secret set YOUTUBE_TOKEN_JSON < config/youtube_token.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Commit updated data files
        if: steps.check_script.outputs.found == 'true'
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_shorts_facts.json data/used_image_urls.json || true
          git diff --cached --quiet || git commit -m "chore: update data files [skip ci]"
          git pull --rebase origin "$BRANCH" || {
            git checkout --theirs data/used_shorts_facts.json data/used_image_urls.json 2>/dev/null || true
            git add data/ 2>/dev/null || true
            git rebase --continue --no-edit
          }
          git push origin "HEAD:$BRANCH"

      - name: Save output as artifact (upload failed — retry backup)
        if: steps.run_pipeline.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_id }}
          path: |
            output/**/video.mp4
            output/**/script.json
            output/**/thumbnail.jpg
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-logs-${{ github.run_id }}
          path: logs/
          retention-days: 3
